<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Blogify</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header>
    <nav class="navbar">
        <a href="../index.html" class="logo">Blogify</a>
        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="login.html">Login</a>
        </div>
    </nav>
</header>

<section class="auth-container">
    <div class="auth-info">
        <p class="tagline">JOIN OUR COMMUNITY</p>
        <h1>Every Voice<br>Has a Story.</h1>
        <p>Create an account and start sharing your
           thoughts, experiences and ideas.</p>
    </div>

    <div class="form-box">
        <h2>Create Account</h2>
        <p>Enter your details to get started.</p>

        <form id="register-form">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your full name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Create password" required>

            <label for="confirm">Confirm Password</label>
            <input type="password" id="confirm" name="confirm_password"
                   placeholder="Confirm password" required>

            <button type="submit" class="btn form-btn">
                Create Account
            </button>
        </form>

        <p class="form-footer">
            Already have an account?
            <a href="login.html">Login</a>
        </p>
    </div>
</section>

<footer>
    <h2>Blogify</h2>
    <p>Build. Share. Connect.</p>
</footer>

<script type="module" src="../js/auth.js"></script>
</body>
</html>
