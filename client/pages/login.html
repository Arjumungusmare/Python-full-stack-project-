
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Blogify</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header>
    <nav class="navbar">
        <a href="../index.html" class="logo">Blogify</a>
        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="signup.html">Sign Up</a>
        </div>
    </nav>
</header>

<section class="auth-container">
    <div class="auth-info">
        <p class="tagline">WELCOME BACK</p>
        <h1>Your Next Story<br>Starts Here.</h1>
        <p>Login to your account and continue
           sharing your ideas with the world.</p>
    </div>

    <div class="form-box">
        <h2>Welcome Back!</h2>
        <p>Login to continue to Blogify.</p>

        <form action="#" method="post">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Enter your password" required>

            <button type="submit" class="btn form-btn">
                Login
            </button>
        </form>

        <p class="form-footer">
            Don't have an account?
            <a href="signup.html">Sign Up</a>
        </p>
    </div>
</section>

<footer>
    <h2>Blogify</h2>
    <p>Build. Share. Connect.</p>
</footer>

</body>
</html>
